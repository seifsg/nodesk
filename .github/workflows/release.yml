# Builds nodesk.exe when a version tag (v0.1.0, ...) is pushed and attaches it to a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Publish the release with nodesk.exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/nodesk.exe --title "NoDesk $GITHUB_REF_NAME" --generate-notes
